name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://user:pass@localhost:5432/gestion_legal?schema=public
      AUTH_SECRET: testing-secret
      NEXTAUTH_SECRET: testing-secret
      NEXTAUTH_URL: http://localhost:3000
      GEMINI_API_KEY: testing-key

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate project
        run: npm run check

      - name: Build app
        run: npm run build
